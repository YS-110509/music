<!DOCTYPE html>
<!--
================================================================================
  技术方案：单文件 HTML，零外部依赖、无 CDN、无需联网，双击即可运行。
  - 音频解码 / 播放：Web Audio API（decodeAudioData + AudioBufferSourceNode）
  - 音频分析：在 Web Worker 中完成（STFT + 自实现 FFT），避免 UI 冻结
  - 打击音：Web Audio 程序化合成（振荡器 + 增益包络），无外部音频文件

  音频分析特征（提取 ≥3 项）：
  1) 频谱通量 Spectral Flux —— 逐帧相邻谱幅度正差之和，用于 onset 起始点检测；
  2) 自相关 + 谐波梳 Comb —— 估计 BPM 与节拍相位，生成节拍网格（beat tracking）；
  3) 频段能量分布（低频/中频/高频/超高频）—— 用于区分音符类型（Flick 高频占比）；
  4) 短时能量 RMS 包络 —— Hold 长音检测与安静段落（结构/密度）检测。

  谱面生成规则（均对齐节拍/onset，非固定模板、非纯随机）：
  - Tap：节拍或细分点上存在 onset（频谱通量峰值）→ 放置 Tap，并对齐到 onset 时间；
  - Hold：节拍处 RMS 持续高于阈值（≥0.3s）→ 长按音符，时长 = 能量持续长度（上限 2.5s）；
  - Flick（Hard）：onset 高频(>2kHz)能量占比 >55% → 拨弦/击镲类音符；
  - 难度差异（不只改下落速度）：
      Easy   = 每拍 1 个候选，仅 Tap；
      Normal = 拍 + 反拍，Tap + Hold；
      Hard   = 16 分细分，Tap + Hold + Flick；
  - 安静段落（RMS < 25% 分位）自动降低密度；onset 稀疏或 BPM 置信度低时，
    降级为均匀节拍生成并在界面提示。
  - 轨道分配采用阶梯/井字等图案（非纯随机），并规避“同手两轨同时占用”的反人类谱面；
    冲突时宁可跳过音符也不强行放置。

  操作方式：
  - 键盘：D / F / J / K（或 1 / 2 / 3 / 4）对应四轨道；按住完成 Hold；Flick 快速点按即可；
  - 触屏 / 鼠标：点击轨道即可；按住完成 Hold，滑动完成 Flick（触控目标 ≥44px）；
  - 主界面提供「新手教程」，逐段引导认识 Tap / Hold / Flick 三种判定。

  判定窗口（代码中显式定义）：
  - Perfect：|偏差| ≤ 100ms
  - Good   ：100ms < |偏差| ≤ 180ms
  - Miss   ：超出 180ms 未击打；Hold 按按住完整度判定；Flick 需快速点按或滑动。

  已知限制：
  - 采用全局恒定 BPM（不追踪局部变速 / 变拍）；
  - 4 轨下落式玩法（BanG Dream 风格简化）；
  - 超长音频（>10 分钟）分析耗时与内存占用会明显增加；
  - iOS 首次播放需点击“开始”以恢复音频上下文（已在代码中 resume() 处理）。
================================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rhythm Forge · 自动谱面音游</title>
<style>
  :root{
    --bg:#0b0d17; --panel:#151a2c; --panel2:#1d2440; --line:#2b3355;
    --accent:#5de0ff; --accent2:#ff5da2; --good:#ffd166; --miss:#ff4d5e;
    --text:#e8ecff; --dim:#8f97b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2346 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow:hidden; height:100dvh; user-select:none; -webkit-user-select:none;
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  .screen.active{display:flex;}
  h1{font-size:clamp(26px,5vw,44px); margin:0 0 4px; letter-spacing:2px;}
  .subtitle{color:var(--dim); margin:0 0 28px; font-size:14px;}

  /* 通用按钮 */
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:12px 22px; border-radius:12px; font-size:15px; cursor:pointer;
    transition:transform .08s, background .15s, border-color .15s;
    min-height:44px; min-width:44px; touch-action:manipulation;
  }
  button:hover{background:#25305a;}
  button:active{transform:scale(.96);}
  button.primary{background:linear-gradient(135deg,#2aa7ff,#5de0ff); color:#04202e; border:none; font-weight:700;}
  button.ghost{background:transparent;}
  button.small{font-size:13px; padding:8px 14px;}

  /* 导入页 / 首页 */
  #screen-import h1{font-size:clamp(34px,6.5vw,56px); font-weight:900; letter-spacing:4px; margin:0;
    background:linear-gradient(92deg,#5de0ff,#a8e6ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;}
  #screen-import .subtitle{color:var(--dim); margin:10px 0 26px; font-size:15px; letter-spacing:2px;}
  .song-section{width:min(720px,96vw); margin-bottom:20px;}
  .section-title{display:flex; align-items:center; gap:14px; justify-content:center; color:var(--dim); font-size:13px; letter-spacing:5px; margin-bottom:16px;}
  .section-title::before,.section-title::after{content:''; flex:1; max-width:110px; height:1px; background:linear-gradient(90deg,transparent,var(--line));}
  .section-title::after{background:linear-gradient(90deg,var(--line),transparent);}
  .song-grid{display:flex; flex-direction:column; gap:10px; width:100%;}
  .song-card{display:flex; align-items:center; gap:14px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; cursor:pointer; background:var(--panel2); text-align:left; transition:border-color .15s, background .15s;}
  .song-card:hover{border-color:var(--accent); background:#222b4d;}
  .song-card:active{background:#1d2545;}
  .song-card .card-icon{width:46px; height:46px; border-radius:10px; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .song-card .card-info{flex:1; min-width:0;}
  .song-card .card-title{font-size:16px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-card .card-artist{font-size:12px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-card .card-dur{font-size:13px; color:var(--accent); flex-shrink:0; font-weight:600;}
  .import-bar{display:flex; gap:12px; align-items:center; width:min(680px,96vw); flex-wrap:wrap; justify-content:center;}
  .dropzone-mini{display:flex; align-items:center; gap:12px; padding:12px 20px; border:1px dashed var(--line); border-radius:14px; cursor:pointer; transition:.2s; background:rgba(255,255,255,.02); text-align:left;}
  .dropzone-mini:hover{border-color:var(--accent); background:rgba(93,224,255,.06);}
  .dropzone-mini.drag{border-color:var(--accent); background:rgba(93,224,255,.12);}
  .dropzone-mini .dz-icon{font-size:26px; color:var(--accent); line-height:1;}
  .dropzone-mini b{display:block; font-size:14px; color:var(--text); font-weight:600;}
  .dropzone-mini small{font-size:11px; color:var(--dim);}
  .hint{color:var(--dim); font-size:11px; margin-top:18px; line-height:1.8; text-align:center;}

  /* 分析页 */
  .bar-wrap{width:min(520px,90vw); height:14px; background:var(--panel2); border-radius:8px; overflow:hidden; margin:18px 0 10px;}
  #analyzeBar{height:100%; width:0%; background:linear-gradient(90deg,#2aa7ff,#5de0ff); border-radius:8px; transition:width .12s;}
  #analyzeText{color:var(--dim); font-size:14px; min-height:20px;}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot 1s linear infinite;margin-bottom:14px;}
  @keyframes rot{to{transform:rotate(360deg);}}

  /* 准备页 */
  .ready-card{width:min(560px,94vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px;}
  .ready-card h2{font-size:20px; margin:0 0 4px; word-break:break-all;}
  #readyMeta{color:var(--dim); font-size:13px; line-height:1.9; margin:8px 0 16px;}
  #readyMeta b{color:var(--text);}
  .warn{color:#ffd166; font-size:13px;}
  .diff-row{display:flex; gap:10px; margin:14px 0;}
  .diff-btn{flex:1; padding:13px 6px; font-size:14px;}
  .diff-btn.sel{border-color:var(--accent); color:var(--accent); background:#15203c;}
  .start-row{display:flex; gap:10px; margin-top:8px;}
  .start-row .primary{flex:1; font-size:17px; padding:15px;}

  /* 游戏页 */
  #screen-game{padding:0;}
  #gameCanvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  .hud{position:absolute; pointer-events:none; z-index:5;}
  #hud-score{top:14px; left:16px; font-size:clamp(18px,3.5vw,28px); font-weight:800;}
  #hud-score small{display:block; font-size:11px; color:var(--dim); font-weight:400;}
  #hud-acc{top:14px; right:16px; text-align:right; font-size:14px; color:var(--dim);}
  #hud-combo{top:14px; left:50%; transform:translateX(-50%); text-align:center;}
  #hud-combo .num{font-size:clamp(26px,5vw,42px); font-weight:900; color:var(--accent);}
  #hud-combo .lbl{font-size:11px; color:var(--dim); letter-spacing:2px;}
  #hud-judge{top:38%; left:50%; transform:translate(-50%,-50%); font-size:clamp(26px,5.5vw,44px); font-weight:900; opacity:0; text-shadow:0 0 18px currentColor;}
  #lyrics{left:50%; transform:translateX(-50%); bottom:16%; text-align:center; width:94vw; pointer-events:none; z-index:4;}
  .lyric{transition:opacity .4s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:3px 0;}
  .lyric.prev,.lyric.next{font-size:clamp(12px,2.3vw,17px); opacity:.34; color:var(--dim); letter-spacing:1px;}
  .lyric.cur{font-size:clamp(22px,5vw,34px); font-weight:800; letter-spacing:.5px;
    background:linear-gradient(92deg,#5de0ff 0%,#9ae6ff 30%,#ffffff 55%,#ffd166 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 10px rgba(93,224,255,.5));}
  #song-progress{position:absolute; bottom:0; left:0; height:5px; background:rgba(255,255,255,.12); width:100%; z-index:5;}
  #song-progress i{display:block; height:100%; width:0%; background:var(--accent);}
  .game-ctrl{position:absolute; top:12px; right:16px; z-index:6;}
  .pause-overlay{position:absolute; inset:0; background:rgba(5,7,15,.82); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:8;}
  .pause-overlay.show{display:flex;}
  .pause-overlay h2{font-size:26px; margin-bottom:18px;}

  /* 结算页 */
  .result-card{width:min(560px,94vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; text-align:center; position:relative; overflow:hidden;}
  .result-card > *{position:relative; z-index:1;}
  #resultRankBg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:clamp(170px,40vw,340px); font-weight:900; color:var(--accent); opacity:.07; z-index:0; pointer-events:none; line-height:1; letter-spacing:-12px;}
  .result-card h2{font-size:24px; margin:0 0 4px;}
  #resultRank{font-size:22px; font-weight:700; margin-bottom:16px; color:var(--text);}
  #resultRank b{color:var(--accent); font-size:26px;}
  .score-big{font-size:clamp(40px,8vw,60px); font-weight:900; color:var(--accent);}
  .score-big small{font-size:14px; color:var(--dim); font-weight:400;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0;}
  .stat{background:var(--panel2); border-radius:12px; padding:12px 4px;}
  .stat .v{font-size:22px; font-weight:800;}
  .stat .k{font-size:11px; color:var(--dim);}
  .stat.p .v{color:var(--accent);} .stat.g .v{color:var(--good);} .stat.m .v{color:var(--miss);}
  .result-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;}

  #toast{position:absolute; bottom:70px; left:50%; transform:translateX(-50%); background:rgba(20,26,48,.95); border:1px solid var(--line); padding:10px 18px; border-radius:12px; font-size:13px; opacity:0; transition:opacity .3s; z-index:20; pointer-events:none; max-width:92vw; text-align:center;}
  #toast.show{opacity:1;}
  .err{color:var(--miss);}
</style>
</head>
<body>

<!-- 导入页 -->
<div id="screen-import" class="screen active">
  <h1>Rhythm Forge</h1>
  <p class="subtitle">随音入梦，化曲为谱，指尖生花</p>

  <div class="song-section">
    <div class="section-title">示例曲目</div>
    <div id="builtinList" class="song-grid"></div>
  </div>

  <div class="import-bar">
    <div id="dropZone" class="dropzone-mini">
      <span class="dz-icon">＋</span>
      <div>
        <b>导入本地音频</b>
        <small>MP3 · WAV · OGG · M4A · FLAC</small>
      </div>
    </div>
    <button class="ghost" id="btnTutorial">📖 新手教程</button>
  </div>

  <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm" hidden>
  <input type="file" id="lrcInput" accept=".lrc,.txt,text/plain" hidden>
  <p class="hint">键盘 D F J K（或 1 2 3 4）· 支持触屏/鼠标 · 示例曲目在线加载</p>
</div>

<!-- 分析页 -->
<div id="screen-analyze" class="screen">
  <div class="spin"></div>
  <h2 style="font-size:20px;">正在分析音频…</h2>
  <div class="bar-wrap"><div id="analyzeBar"></div></div>
  <div id="analyzeText">准备中…</div>
</div>

<!-- 准备页 -->
<div id="screen-ready" class="screen">
  <div class="ready-card">
    <h2 id="readySong">未命名</h2>
    <div id="readyMeta"></div>
    <div class="diff-row">
      <button class="diff-btn" data-diff="easy">Easy<br><small style="color:var(--dim)">每拍 · 仅 Tap</small></button>
      <button class="diff-btn sel" data-diff="normal">Normal<br><small style="color:var(--dim)">拍+反拍 · +Hold</small></button>
      <button class="diff-btn" data-diff="hard">Hard<br><small style="color:var(--dim)">16分 · +Flick</small></button>
    </div>
    <div id="diffInfo" style="font-size:13px;color:var(--dim);margin-bottom:4px;"></div>
    <div class="start-row" style="margin-top:6px;">
      <button class="ghost" id="btnLrc">🎤 上传 LRC 歌词（可选）</button>
      <span id="lrcStatus" style="align-self:center;font-size:12px;color:var(--dim);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未上传歌词</span>
    </div>
    <div class="start-row">
      <button class="ghost" id="btnBackImport">重新选歌</button>
      <button class="primary" id="btnStart">▶ 开始游戏</button>
    </div>
  </div>
</div>

<!-- 游戏页 -->
<div id="screen-game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div class="hud" id="hud-score">0<small>SCORE</small></div>
  <div class="hud" id="hud-acc">ACC 100.0%</div>
  <div class="hud" id="hud-combo"><div class="num" id="comboNum">0</div><div class="lbl">COMBO</div></div>
  <div class="hud" id="hud-judge"></div>
  <div class="hud" id="tutorial-banner" style="top:15%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(13px,2.8vw,19px);color:var(--accent);text-shadow:0 0 14px rgba(93,224,255,.55);width:94vw;"></div>
  <div class="hud" id="lyrics" style="display:none;">
    <div id="lyric-prev" class="lyric prev"></div>
    <div id="lyric-cur" class="lyric cur"></div>
    <div id="lyric-next" class="lyric next"></div>
  </div>
  <div id="song-progress"><i></i></div>
  <div id="footer" style="position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:10px; color:rgba(255,255,255,.32); pointer-events:none; z-index:3; line-height:1.5;">萌ICP备20265009号<br>© 2026 樱岛芦花. All Rights Reserved.</div>
  <button class="game-ctrl small" id="btnPause">⏸ 暂停</button>
  <div class="pause-overlay" id="pauseOverlay">
    <h2>已暂停</h2>
    <div class="start-row" style="width:min(320px,80vw);">
      <button class="ghost" id="btnResume">继续</button>
      <button class="primary" id="btnQuit">结束</button>
    </div>
  </div>
</div>

<!-- 结算页 -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div id="resultRankBg"></div>
    <h2 id="resultTitle">结算</h2>
    <div id="resultRank"></div>
    <div class="score-big" id="resultScore">0<small> pts</small></div>
    <div id="resultHigh" style="font-size:13px;color:var(--dim);margin-top:6px;"></div>
    <div class="stats">
      <div class="stat p"><div class="v" id="rPerfect">0</div><div class="k">Perfect</div></div>
      <div class="stat g"><div class="v" id="rGood">0</div><div class="k">Good</div></div>
      <div class="stat m"><div class="v" id="rMiss">0</div><div class="k">Miss</div></div>
      <div class="stat"><div class="v" id="rCombo">0</div><div class="k">最大连击</div></div>
    </div>
    <div style="font-size:14px;color:var(--dim);margin-bottom:10px;">准确率 <b id="rAcc" style="color:var(--text);">100.0%</b></div>
    <div class="result-btns">
      <button class="ghost" id="btnRetry">↻ 重新游玩</button>
      <button class="ghost" id="btnChangeDiff">切换难度</button>
      <button class="primary" id="btnNewSong">导入新曲目</button>
      <button class="ghost" id="btnShare">📤 分享战绩</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============================== 常量 ============================== */
const PERFECT_WINDOW = 0.100;   // 100ms
const GOOD_WINDOW    = 0.180;   // 180ms
const FLICK_MAX_MS   = 260;     // Flick 快速点按/滑动判定时限
const FLICK_MIN_DIST = 24;      // Flick 触屏判定为“滑动”的最小位移(px)
const APPROACH = { easy: 2.4, normal: 2.0, hard: 1.6 }; // 下落提前时间（秒）
const LANE_KEYS = {
  'd':0,'f':1,'j':2,'k':3,
  '1':0,'2':1,'3':2,'4':3
};
const LANE_COLORS = ['#5de0ff','#5dff9b','#ffd166','#ff5da2'];
const TAP_COLOR = '#5de0ff';
const FLICK_COLOR = '#ff9d3f';
const HOLD_COLOR = '#5dff9b';

/* ============================== 状态 ============================== */
let audioCtx = null, masterGain = null, sfxGain = null;
let audioBuffer = null, fileName = '', fileKey = '';
let worker = null;
let charts = null, meta = null, selectedDiff = 'normal';
let chart = null;

let notes = [], score = 0, combo = 0, maxCombo = 0;
let counts = { perfect:0, good:0, miss:0 };
let activeHold = [null,null,null,null], holdFill = [0,0,0,0];
let activeFlick = [null,null,null,null], flickPressMs = [0,0,0,0], flickSwipe = [0,0,0,0];
let particles = [];
let ambient = [], mood = 'calm', coverImage = null;
let lyrics = [], lyricIndex = -1, lastCurText = '';
let source = null, startCtxTime = 0, songTime = 0;
let started = false, ended = false, paused = false;
let mode = 'song';                       // 'song' | 'tutorial'
let tutorialDuration = 0, tutorialBeats = [], tutBeatIdx = 0;
let judgeElTimer = null;

const $ = id => document.getElementById(id);
const screens = ['import','analyze','ready','game','result'];
function show(id){ screens.forEach(s => $('screen-'+s).classList.toggle('active', s===id)); }

/* ============================== 音频工具 ============================== */
function ensureAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.92; masterGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.45; sfxGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

/* 程序化合成打击音（无外部音频文件） */
function playHitSound(kind){
  if(!audioCtx || paused) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  let base = 520;
  if(kind === 'flick') base = 980;
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base*0.45, t + 0.09);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t + 0.12);
}

function mixdownMono(buf){
  const n = buf.length, ch = buf.numberOfChannels;
  const out = new Float32Array(n);
  for(let c=0;c<ch;c++){
    const d = buf.getChannelData(c);
    for(let i=0;i<n;i++) out[i] += d[i];
  }
  if(ch>1){ const inv = 1/ch; for(let i=0;i<n;i++) out[i]*=inv; }
  return out;
}
function resample(mono, srcRate, dstRate){
  if(srcRate === dstRate) return mono;
  const ratio = srcRate/dstRate;
  const len = Math.floor(mono.length/ratio);
  const out = new Float32Array(len);
  for(let i=0;i<len;i++){
    const pos = i*ratio, i0 = pos|0, frac = pos - i0;
    const i1 = Math.min(i0+1, mono.length-1);
    out[i] = mono[i0]*(1-frac) + mono[i1]*frac;
  }
  return out;
}

/* ---------- 封面提取（ID3v2 APIC / MP4 covr，尽力而为） ---------- */
function u32be(b,o){ return ((b[o]<<24)>>>0)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3]; }
function syncsafe(b,o){ return ((b[o]&0x7f)<<21)|((b[o+1]&0x7f)<<14)|((b[o+2]&0x7f)<<7)|(b[o+3]&0x7f); }
function fourCC(b,o){ return String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]); }
function sniffMime(b,o){
  if(b[o]===0xff && b[o+1]===0xd8) return 'image/jpeg';
  if(b[o]===0x89 && b[o+1]===0x50 && b[o+2]===0x4e && b[o+3]===0x47) return 'image/png';
  if(b[o]===0x47 && b[o+1]===0x49 && b[o+2]===0x46) return 'image/gif';
  return 'image/jpeg';
}
function extractCoverArt(buf){
  const u8 = new Uint8Array(buf);
  // ID3v2 APIC（MP3）
  if(u8.length>10 && u8[0]===0x49 && u8[1]===0x44 && u8[2]===0x33){
    const ver=u8[3], flags=u8[5], size=syncsafe(u8,6);
    const end=Math.min(10+size, u8.length);
    let off=10;
    if(flags&0x40){ const es=(ver>=4)?syncsafe(u8,off):u32be(u8,off); off += (ver>=4)?es:(es+4); }
    while(off+10<=end){
      const id=fourCC(u8,off);
      const fsize=(ver>=4)?syncsafe(u8,off+4):u32be(u8,off+4);
      if(fsize<=0 || off+10+fsize>end) break;
      if(id==='APIC'){
        const ds=off+10, de=off+10+fsize, enc=u8[ds];
        let p=ds+1, ms=p;
        while(p<de && u8[p]!==0) p++;
        const mime=(p>ms)?String.fromCharCode.apply(null, Array.from(u8.subarray(ms,p))):'image/jpeg';
        p++; p++; // null + picture type
        if(enc===1||enc===2){ while(p+1<de && !(u8[p]===0&&u8[p+1]===0)) p+=2; p+=2; }
        else { while(p<de && u8[p]!==0) p++; p++; }
        if(p<de) return { mime:(mime.indexOf('/')>=0?mime:'image/jpeg'), data:u8.slice(p,de) };
      }
      off += 10+fsize;
    }
  }
  // MP4 covr（M4A）
  if(u8.length>12 && fourCC(u8,4)==='ftyp'){
    function walk(start,end){
      let o=start;
      while(o+8<=end){
        let sz=u32be(u8,o), hdr=8;
        const typ=fourCC(u8,o+4);
        if(sz===1) break;
        if(sz===0) sz=end-o;
        if(sz<8) break;
        if(typ==='moov'||typ==='udta'||typ==='meta'||typ==='ilst'){
          let cs=o+hdr; if(typ==='meta') cs+=4;
          const r=walk(cs, o+sz); if(r) return r;
        } else if(typ==='covr'){
          let d=o+hdr;
          while(d+8<=o+sz){
            const dsz=u32be(u8,d), dt=fourCC(u8,d+4);
            if(dt==='data' && dsz>=16){
              const is=d+16, ie=Math.min(d+dsz, o+sz);
              if(ie>is) return { mime:sniffMime(u8,is), data:u8.slice(is,ie) };
            }
            if(dsz<8) break; d+=dsz;
          }
        }
        o+=sz;
      }
      return null;
    }
    const r=walk(0, u8.length); if(r) return r;
  }
  return null;
}
function loadCoverArt(arrayBuf){
  const c=extractCoverArt(arrayBuf);
  if(!c) return;
  const blob=new Blob([c.data], {type:c.mime});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{ coverImage=img; };
  img.src=url;
}

function buildWorker(){

'}\n' +
'function analyze(mono){\n' +

'  var bHigh=new Float32Array(nFrames), bUHF=new Float32Array(nFrames);\n' +

'  function comb(bpm){var tau=60/(bpm*HOP_SEC);var sc=0;for(var k=1;k<=4;k++){var idx=Math.round(k*tau);if(idx<ac.length)sc+=ac[idx];}return sc;}\n' +
'  function prior(bpm){if(bpm>=90&&bpm<=170)return 1.0;if(bpm>=70&&bpm<90)return 0.95;if(bpm>170&&bpm<=190)return 0.95;return 0.7;}\n' +
'  var bestBpm=120,bestScore=-1e9;\n' +

'  var cands=[bestBpm]; if(bestBpm/2>=55)cands.push(bestBpm/2); if(bestBpm*2<=215)cands.push(bestBpm*2);\n' +
'  for(var ci=0;ci<cands.length;ci++){var c2=comb(cands[ci])*prior(cands[ci]);if(c2>bestScore){bestScore=c2;bestBpm=cands[ci];}}\n' +
'  // 相位 + 节拍网格\n' +
'  var periodF=60/(bestBpm*HOP_SEC), P=Math.round(periodF);\n' +
'  var bestPh=0,bestPhS=-1e9;\n' +
'  for(var ph=0;ph<P;ph++){var s2=0;for(var t4=ph;t4<nFrames;t4+=P)s2+=norm[t4];if(s2>bestPhS){bestPhS=s2;bestPh=ph;}}\n' +
'  var beats=[]; var prev=-1e9;\n' +
'  var snapWin=0.35*periodF*HOP_SEC, minSep=0.5*periodF*HOP_SEC;\n' +
'  for(var t5=bestPh;t5<nFrames;t5+=P){\n' +
'    var time=t5*HOP_SEC, bt=time;\n' +
'    if(onsets.length){var ni=nearestOnset(onsets,time);var o=onsets[ni];if(Math.abs(o.time-time)<snapWin)bt=o.time;}\n' +
'    if(bt-prev>=minSep){beats.push(bt);prev=bt;}\n' +
'  }\n' +
'  self.postMessage({type:"progress",frac:0.86,stage:"节拍跟踪"});\n' +
'  // RMS 平滑、安静阈值、Hold 阈值\n' +
'  var smoothRms=movingAvg(rms,5);\n' +
'  var quietThr=percentile(smoothRms,0.25);\n' +
'  var holdThr=Math.max(0.03,percentile(smoothRms,0.75)*0.55);\n' +
'  // 音频实际结束位置（尾部静音检测）+ 静音阈值\n' +
'  var p95Energy=percentile(smoothRms,0.95);\n' +
'  var silenceThr=Math.max(0.002,p95Energy*0.03);\n' +
'  var lastActive=0; for(var ia=nFrames-1;ia>=0;ia--){if(smoothRms[ia]>silenceThr){lastActive=ia;break;}}\n' +
'  var audioEnd=Math.min(duration,(lastActive+8)*HOP_SEC);\n' +
'  // 置信度\n' +
'  var onsetRate=onsets.length/duration;\n' +
'  var fallback=false, warnings=[];\n' +
'  if(onsets.length<Math.max(8,duration*0.4)){fallback=true;warnings.push("Onset 稀疏，已使用均匀节拍降级生成");}\n' +
'  if(bestScore<0.5){fallback=true;warnings.push("BPM 置信度低，采用默认 120 BPM 均匀节拍");bestBpm=120;periodF=60/(bestBpm*HOP_SEC);P=Math.round(periodF);beats=[];for(var t6=P;t6<nFrames;t6+=P)beats.push(t6*HOP_SEC);}\n' +
'  if(beats.length<4){fallback=true;warnings.push("节拍数量过少，使用均匀节拍");beats=[];for(var t7=P;t7<nFrames;t7+=P)beats.push(t7*HOP_SEC);}\n' +
'  self.postMessage({type:"progress",frac:0.96,stage:"生成谱面"});\n' +
'  // 曲风/情绪启发式估计：慢歌→雪/雨，快歌→火花，中速→星点\n' +
'  var meanHigh=0; for(var io=0;io<onsets.length;io++)meanHigh+=onsets[io].highFrac; meanHigh=onsets.length?meanHigh/onsets.length:0;\n' +
'  var mood="calm"; if(bestBpm<100)mood=meanHigh<0.4?"snow":"rain"; else if(bestBpm>=130||meanHigh>0.6)mood="energetic";\n' +
'  return {nFrames:nFrames,duration:duration,bpm:bestBpm,confidence:bestScore,fallback:fallback,\n' +
'    beats:beats,onsets:onsets,smoothRms:smoothRms,quietThr:quietThr,holdThr:holdThr,warnings:warnings,mood:mood,audioEnd:audioEnd,silenceThr:silenceThr};\n' +
'}\n' +
'function findOnsetNear(ana,time,tol){\n' +
'  if(!ana.onsets.length)return null;\n' +
'  var ni=nearestOnset(ana.onsets,time); var o=ana.onsets[ni];\n' +
'  return Math.abs(o.time-time)<=tol?o:null;\n' +
'}\n' +
'function findHold(ana,start){\n' +
'  var f0=Math.round(start/HOP_SEC), thr=ana.holdThr;\n' +
'  var minF=Math.round(0.30/HOP_SEC), maxF=Math.round(2.5/HOP_SEC);\n' +
'  var end=f0, dip=0, dipMax=Math.round(0.15/HOP_SEC);\n' +
'  for(var i=f0;i<f0+maxF && i<ana.nFrames;i++){\n' +

'  }\n' +

'}\n' +
'function generateChart(ana,diffKey){\n' +
'  var cfg=DIFF[diffKey], notes=[];\n' +
'  var period=60/ana.bpm;\n' +
'  var laneLast=[-10,-10,-10,-10], lastNoteTime=-10;\n' +
'  // 收集候选时间（节拍 + 细分，细分点需有 onset）\n' +
'  var cands=[];\n' +
'  for(var bi=0;bi<ana.beats.length;bi++){\n' +
'    var bt=ana.beats[bi];\n' +
'    for(var s=0;s<cfg.subdiv;s++){\n' +
'      var t=bt+(s/cfg.subdiv)*period;\n' +
'      if(s===0){cands.push({t:t,isBeat:true,sub:0});}\n' +
'      else{var p=findOnsetNear(ana,t,0.045);if(p)cands.push({t:p.time,isBeat:false,sub:s,peak:p});else if(cfg.fillProb>0){var ef=Math.round(t/HOP_SEC);if(ef>=0&&ef<ana.nFrames&&ana.smoothRms[ef]>ana.quietThr*1.6&&Math.random()<cfg.fillProb)cands.push({t:t,isBeat:false,sub:s,peak:null});}}\n' +
'    }\n' +
'  }\n' +
'  cands.sort(function(a,b){return a.t-b.t;});\n' +
'  var PATTERNS=[[0,1,2,3],[3,2,1,0],[0,3,1,2],[1,2,0,3],[0,2,1,3]];\n' +
'  var SAME_LANE_GAP=0.08, patIdx=0, patPos=0, noteCount=0;\n' +
'  function sib(l){return l^1;}\n' +
'  function chooseLane(time){\n' +
'    var usable=[];\n' +
'    for(var l=0;l<4;l++){if(laneLast[l]+SAME_LANE_GAP<=time && laneLast[sib(l)]<time)usable.push(l);}\n' +
'    if(usable.length===0)return -1;\n' +
'    for(var k=0;k<4;k++){var cand=PATTERNS[patIdx][(patPos+k)%4];if(usable.indexOf(cand)>=0){patPos=(patPos+1)%4;return cand;}}\n' +
'    return usable[0];\n' +
'  }\n' +
'  function energyAt(t){var f=Math.round(t/HOP_SEC);if(f<0)f=0;if(f>=ana.nFrames)f=ana.nFrames-1;return ana.smoothRms[f];}\n' +
'  for(var ci=0;ci<cands.length;ci++){\n' +
'    var c=cands[ci], t=c.t;\n' +
'    if(t<0.8||t>ana.audioEnd-0.2)continue;\n' +
'    if(t-lastNoteTime<cfg.minGap)continue;\n' +
'    var energy=energyAt(t), quiet=energy<ana.quietThr;\n' +
'    if(energy<ana.silenceThr)continue;\n' +
'    var peak=c.peak||findOnsetNear(ana,t,0.06);\n' +

'    if(diffKey==="easy" && (!c.isBeat || (quiet && Math.random()<0.6)))continue;\n' +
'    if(diffKey==="normal" && !c.isBeat && quiet)continue;\n' +
'    if(diffKey==="hard" && quiet && Math.random()<0.2)continue;\n' +
'    var lane=chooseLane(t);\n' +
'    if(lane<0)continue;\n' +
'    var note={time:t,lane:lane,type:type,duration:0};\n' +
'    if(type==="hold"){note.duration=hold.duration;note.end=t+hold.duration;laneLast[lane]=note.end;}\n' +
'    else laneLast[lane]=t;\n' +
'    notes.push(note); lastNoteTime=t;\n' +
'    noteCount++; if(noteCount%10===0)patIdx=(patIdx+1)%PATTERNS.length;\n' +
'  }\n' +
'  return {notes:notes,bpm:ana.bpm};\n' +
'}\n' +
'self.onmessage=function(e){\n' +
'  var msg=e.data;\n' +
'  if(msg.type==="analyze"){\n' +
'    var ana=analyze(msg.mono);\n' +
'    if(!ana)return;\n' +
'    var charts={};\n' +
'    ["easy","normal","hard"].forEach(function(d){charts[d]=generateChart(ana,d);});\n' +
'    self.postMessage({type:"done",charts:charts,meta:{bpm:ana.bpm,confidence:ana.confidence,fallback:ana.fallback,warnings:ana.warnings,duration:ana.duration,onsetCount:ana.onsets.length,beatCount:ana.beats.length,mood:ana.mood}});\n' +
'  }\n' +
'};\n';
  const blob = new Blob([src], {type:'application/javascript'});
  return new Worker(URL.createObjectURL(blob));
}

/* ============================== 文件导入 / 分析 ============================== */
async function handleFile(file){
  try{
    if(!file){
      toast('未选择文件', true); return;
    }
    const ext = (file.name.split('.').pop()||'').toLowerCase();
    const okExt = ['mp3','wav','ogg','oga','m4a','aac','flac','webm','mp4','opus'];
    if(okExt.indexOf(ext) < 0 && file.type.indexOf('audio') < 0){
      toast('不是支持的音频文件（MP3/WAV/OGG/M4A/FLAC 等）', true); return;
    }
    ensureAudioCtx();
    lyrics = []; lyricIndex = -1; lastCurText = '';
    show('analyze');
    $('analyzeText').textContent = '解码音频…';
    $('analyzeBar').style.width = '3%';
    let buf;
    try{
      const arrayBuf = await file.arrayBuffer();
      coverImage = null;
      try{ loadCoverArt(arrayBuf); }catch(e){ coverImage = null; }
      buf = await audioCtx.decodeAudioData(arrayBuf);
    }catch(e){
      toast('无法解码该音频，可能不是有效音频文件', true);
      show('import'); return;
    }
    if(buf.duration < 5){
      toast('音频过短（<5 秒），请选择更长的音频', true);
      show('import'); return;
    }
    startAnalysis(buf, file.name, file.name + '|' + Math.round(buf.duration) + '|' + buf.sampleRate);
  }catch(err){
    toast('导入失败：' + err.message, true);
    show('import');
  }
}
function startAnalysis(buf, name, key){
  audioBuffer = buf;
  fileName = name;
  fileKey = key;
  $('analyzeText').textContent = '混音 / 重采样…';
  $('analyzeBar').style.width = '8%';
  // 解绑旧 worker
  if(worker){ worker.terminate(); }
  worker = buildWorker();
  worker.onmessage = function(ev){
    const m = ev.data;
    if(m.type === 'progress'){
      $('analyzeBar').style.width = Math.round(8 + m.frac*88) + '%';
      $('analyzeText').textContent = m.stage + '  ' + Math.round(m.frac*100) + '%';
    } else if(m.type === 'done'){
      charts = m.charts; meta = m.meta;
      showReady();
    } else if(m.type === 'error'){
      toast(m.message, true); show('import');
    }
  };
  worker.onerror = function(e){
    toast('分析过程出错：' + (e.message||'未知'), true);
    show('import');
  };
  // 主线程混音 + 重采样后转交 worker（避免 UI 冻结在分析循环）
  const mono = mixdownMono(buf);
  const rs = resample(mono, buf.sampleRate, 22050);
  worker.postMessage({type:'analyze', mono: rs}, [rs.buffer]);
}

function fmtTime(s){ const m=Math.floor(s/60), r=Math.round(s%60); return m+':'+(r<10?'0':'')+r; }

/* ============================== 游戏 ============================== */
function startGame(){
  if(!charts) return;
  chart = charts[selectedDiff];
  notes = chart.notes.map(n => ({time:n.time, lane:n.lane, type:n.type, duration:n.duration||0,
    end:n.end||n.time, state:'pending', judged:false, grade:null, headGrade:null}));
  notes.sort((a,b)=>a.time-b.time);
  score = 0; combo = 0; maxCombo = 0;
  counts = {perfect:0, good:0, miss:0};
  mode = 'song';
  $('tutorial-banner').textContent = '';
  ambient = [];
  lyricIndex = -1; lastCurText = '';
  $('lyrics').style.display = (lyrics.length > 0) ? 'block' : 'none';
  $('lyric-prev').textContent = ''; $('lyric-cur').textContent = ''; $('lyric-next').textContent = '';
  activeHold = [null,null,null,null]; holdFill = [0,0,0,0];
  activeFlick = [null,null,null,null]; flickPressMs = [0,0,0,0]; flickSwipe = [0,0,0,0];
  particles = [];
  started = false; ended = false; paused = false;
  show('game');
  resizeCanvas();
  updateHUD();
  $('pauseOverlay').classList.remove('show');
  $('btnPause').style.display = 'block';
  flashJudge('READY', '#5de0ff', 900);
  setTimeout(()=>{ flashJudge('GO', '#5dff9b', 500); }, 700);
  // 启动播放
  if(audioCtx.state === 'suspended') audioCtx.resume();
  source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(masterGain);
  source.onended = function(){ ended = true; };
  source.start(0);
  startCtxTime = audioCtx.currentTime;
  started = true;
  if(!gameRaf) gameRaf = requestAnimationFrame(loop);
}

function finalizeNote(note, grade){
  note.state = 'done'; note.judged = true; note.grade = grade;
  if(grade === 'perfect'){ score += 1000; counts.perfect++; combo++; }
  else if(grade === 'good'){ score += 600; counts.good++; combo++; }
  else { counts.miss++; combo = 0; }
  if(combo > maxCombo) maxCombo = combo;
  if(grade !== 'miss') playHitSound(note.type);
  spawnFeedback(note.lane, grade, note.type);
  updateHUD();
}

function pressLane(lane, source){
  if(!started || ended || paused) return;
  let best = null, bestT = Infinity;
  for(let i=0;i<notes.length;i++){
    const n = notes[i];
    if(n.lane !== lane || n.state !== 'pending') continue;
    if(n.time - songTime > GOOD_WINDOW) continue; // 太早
    if(songTime - n.time > GOOD_WINDOW) continue; // 太晚
    if(n.time < bestT){ bestT = n.time; best = n; }
  }
  if(!best) return;
  const delta = songTime - best.time;
  const abs = Math.abs(delta);
  const grade = abs <= PERFECT_WINDOW ? 'perfect' : 'good';
  if(best.type === 'hold'){
    best.state = 'hit';
    best.headGrade = grade;
    activeHold[lane] = best;
    holdFill[lane] = 0;
    flashJudge(grade.toUpperCase(), grade==='perfect'?'#5de0ff':'#ffd166', 380);
  } else if(best.type === 'flick'){
    // Flick：按下判定时机，松手/滑动判定手势（快速点按或滑动）
    best.state = 'hit';
    best.headGrade = grade;
    best.flickSource = source || 'key';
    activeFlick[lane] = best;
    flickPressMs[lane] = performance.now();
    flickSwipe[lane] = 0;
    flashJudge('FLICK', '#ff9d3f', 300);
  } else {
    finalizeNote(best, grade);
  }
}
function releaseLane(lane){
  const hold = activeHold[lane];
  if(hold){
    activeHold[lane] = null; holdFill[lane] = 0;
    if(hold.state !== 'hit') return;
    const held = Math.max(0, songTime - hold.time);
    const completion = Math.min(1, hold.duration>0 ? held/hold.duration : 0);
    let grade;
    if(completion < 0.25) grade = 'miss';
    else if(hold.headGrade === 'perfect' && completion >= 0.75) grade = 'perfect';
    else grade = 'good';
    finalizeNote(hold, grade);
    return;
  }
  const flick = activeFlick[lane];
  if(flick){
    activeFlick[lane] = null;
    finalizeFlick(lane, flick, false);
  }
}
function finalizeFlick(lane, flick, forced){
  if(flick.state !== 'hit') return;
  const heldMs = performance.now() - flickPressMs[lane];
  let gestureOk;
  if(flick.flickSource === 'touch'){
    gestureOk = flickSwipe[lane] >= FLICK_MIN_DIST || heldMs <= FLICK_MAX_MS;
  } else {
    gestureOk = heldMs <= FLICK_MAX_MS;
  }
  if(forced) gestureOk = false;
  const grade = gestureOk ? flick.headGrade : (flick.headGrade === 'perfect' ? 'good' : flick.headGrade);
  finalizeNote(flick, grade);
}
function updateMisses(){
  for(let i=0;i<notes.length;i++){
    const n = notes[i];
    if(n.state !== 'pending') continue;
    if(n.type === 'hold' && activeHold[n.lane] === n) continue; // 正在按
    if(songTime > n.time + GOOD_WINDOW){
      finalizeNote(n, 'miss');
    }
  }
  // Flick 按下后长时间未松手 → 判定为 Good（手势过慢）
  for(let l=0;l<4;l++){
    const f = activeFlick[l];
    if(f && songTime > f.time + 0.7){ finalizeFlick(l, f, true); }
  }
}

/* ---------- 反馈 ---------- */
function spawnFeedback(lane, grade, type){
  const laneX = lane * (canvas.clientWidth/4) + canvas.clientWidth/8;
  const y = judgeY() - 30;
  const color = grade==='perfect' ? '#5de0ff' : grade==='good' ? '#ffd166' : '#ff4d5e';
  const txt = grade.toUpperCase();
  flashJudge(txt, color, 520);
  const n = grade==='miss' ? 4 : 14;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 120 + Math.random()*260;
    particles.push({x:laneX, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 120,
      life:0.5, ttl:0.5, color, size:2+Math.random()*4});
  }
}
let judgeTimer = null;
function flashJudge(text, color, ms){
  const el = $('hud-judge');
  el.textContent = text;
  el.style.color = color;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%,-50%) scale(1.25)';
  if(judgeTimer) clearTimeout(judgeTimer);
  requestAnimationFrame(()=>{ el.style.transition='none'; el.style.transform='translate(-50%,-50%) scale(0.9)'; });
  judgeTimer = setTimeout(()=>{
    el.style.transition='transform .25s, opacity .25s';
    el.style.transform='translate(-50%,-50%) scale(1) translateY(-14px)';
    el.style.opacity='0';
  }, ms||520);
}

/* ---------- 绘制 ---------- */
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
let gameRaf = null;

function judgeY(){ return canvas.clientHeight - Math.max(84, canvas.clientHeight*0.15); }
function speedPx(){ const dist = judgeY() - 56; return dist / APPROACH[selectedDiff]; }
function resizeCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  canvas.width = Math.floor(canvas.clientWidth*dpr);
  canvas.height = Math.floor(canvas.clientHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);

function draw(){
  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.clearRect(0,0,W,H);
  const jy = judgeY(), sp = speedPx();
  const laneW = W/4;
  // 背景网格
  ctx.fillStyle = '#0b0d17'; ctx.fillRect(0,0,W,H);
  updateAndDrawAmbient(W, H);
  if(coverImage && mode !== 'tutorial') drawCoverCard(W, H);
  for(let l=0;l<4;l++){
    const x = l*laneW;
    ctx.fillStyle = (l%2) ? 'rgba(255,255,255,.022)' : 'rgba(255,255,255,.045)';
    ctx.fillRect(x, 0, laneW, H);
    ctx.strokeStyle = 'rgba(120,135,180,.14)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // 判定线
  ctx.save();
  const glow = ctx.createLinearGradient(0, jy-26, 0, jy+14);
  glow.addColorStop(0,'rgba(93,224,255,0)');
  glow.addColorStop(0.6,'rgba(93,224,255,.22)');
  glow.addColorStop(1,'rgba(93,224,255,.05)');
  ctx.fillStyle = glow; ctx.fillRect(0, jy-26, W, 40);
  ctx.strokeStyle = '#5de0ff';
  ctx.lineWidth = 2.4;
  ctx.shadowColor = '#5de0ff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(0, jy); ctx.lineTo(W, jy); ctx.stroke();
  ctx.restore();

  // 音符
  for(let i=0;i<notes.length;i++){
    const n = notes[i];
    if(n.state === 'done') continue;
    const tHead = n.time, tTail = n.type==='hold' ? n.end : n.time;
    const yHead = jy - (tHead - songTime) * sp;
    const yTail = jy - (tTail - songTime) * sp;
    if(n.type === 'hold'){
      if(yHead < -60 || yTail > H + 60) continue; // 头部进入即显示，尾部离开才消失
    } else {
      if(yHead < -80 || yHead > H + 60) continue;
    }
    const x = n.lane*laneW + laneW*0.14;
    const nw = laneW*0.72;
    let col = TAP_COLOR;
    if(n.type==='hold') col = HOLD_COLOR;
    else if(n.type==='flick') col = FLICK_COLOR;
    if(n.type === 'hold'){
      const yTop = Math.max(Math.min(yHead, yTail), -60);
      const yBot = Math.min(Math.max(yHead, yTail), H+60);
      if(yBot < -40 || yTop > H+40) continue;
      const active = n.state === 'hit';
      // 身体：按住时高亮，接近时半透明
      ctx.fillStyle = active ? col : col+'55';
      roundRect(x, yTop, nw, Math.max(0, yBot-yTop), 8); ctx.fill();
      // 按住进度填充（白色覆盖，自头部向上增长）
      if(active){
        const frac = Math.min(1, holdFill[n.lane]||0);
        const bodyH = yBot - yTop;
        if(bodyH > 4 && frac > 0.01){
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          roundRect(x, yBot - bodyH*frac, nw, bodyH*frac, 8); ctx.fill();
        }
      }
      // 头
      if(yHead > -40 && yHead < H+40){
        ctx.save();
        ctx.fillStyle = col;
        if(active){ ctx.shadowColor = col; ctx.shadowBlur = 20; }
        roundRect(x, yHead-14, nw, 28, 8); ctx.fill();
        ctx.restore();
      }
      // 尾
      if(yTail > -40 && yTail < H+40){
        ctx.fillStyle = col; ctx.globalAlpha = .9;
        roundRect(x, yTail-10, nw, 20, 8); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else {
      if(yHead < -40 || yHead > H+40) continue;
      const h = Math.max(44, Math.min(laneW*0.5, 60));
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = n.type==='flick' ? 16 : 8;
      ctx.fillStyle = col;
      roundRect(x, yHead - h/2, nw, h, h*0.34); ctx.fill();
      ctx.restore();
      // 中心线
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(x+nw*0.16, yHead-2, nw*0.68, 4);
      if(n.type==='flick'){
        ctx.fillStyle = '#fff';
        ctx.font = 'bold '+Math.round(h*0.5)+'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('↥', x+nw/2, yHead+1);
      }
    }
  }
  // 粒子
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= 1/60; p.x += p.vx/60; p.y += p.vy/60; p.vy += 420/60;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, p.life/p.ttl);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 已按轨道的判定线高亮 + Hold 进度条
  for(let l=0;l<4;l++){
    if(activeHold[l]){
      const x = l*laneW;
      const pulse = 0.16 + 0.10*Math.sin(performance.now()/130);
      ctx.fillStyle = 'rgba(93,224,255,'+pulse.toFixed(3)+')';
      ctx.fillRect(x, jy-30, laneW, 44);
      // Hold 完成度进度条
      const frac = Math.min(1, holdFill[l]||0);
      const bx = x + laneW*0.12, bw = laneW*0.76;
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      roundRect(bx, jy-48, bw, 10, 5); ctx.fill();
      ctx.fillStyle = HOLD_COLOR;
      roundRect(bx, jy-48, bw*frac, 10, 5); ctx.fill();
    }
  }
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- 背景氛围（曲风/情绪启发式） ---------- */
function updateAndDrawAmbient(W, H){
  if(ambient.length < 160 && Math.random() < 0.5){
    if(mood === 'snow'){
      ambient.push({x:Math.random()*W, y:-12, vx:(Math.random()-0.5)*24, vy:50+Math.random()*60, r:1.5+Math.random()*2.5, kind:'snow'});
    } else if(mood === 'rain'){
      ambient.push({x:Math.random()*W, y:-20, vx:-30, vy:650+Math.random()*350, r:1, kind:'rain'});
    } else if(mood === 'energetic'){
      ambient.push({x:Math.random()*W, y:H+12, vx:(Math.random()-0.5)*20, vy:-(50+Math.random()*90), r:2+Math.random()*3, kind:'spark', c:['#ffd166','#ff5da2','#5de0ff','#5dff9b'][Math.floor(Math.random()*4)]});
    } else {
      ambient.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, r:0.6+Math.random()*1.4, kind:'star'});
    }
  }
  for(let i=ambient.length-1;i>=0;i--){
    const p=ambient[i];
    p.x += p.vx/60; p.y += p.vy/60;
    if(p.kind==='snow') p.x += Math.sin(p.y*0.02)*0.5;
    if(p.y>H+25 || p.y<-25 || p.x<-25 || p.x>W+25){ ambient.splice(i,1); continue; }
    if(p.kind==='rain'){
      ctx.strokeStyle='rgba(160,200,255,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx*0.02, p.y+14); ctx.stroke();
    } else if(p.kind==='star'){
      const tw=0.35+0.25*Math.sin(performance.now()/400 + p.x);
      ctx.fillStyle='rgba(210,225,255,'+tw.toFixed(2)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    } else if(p.kind==='spark'){
      ctx.fillStyle=p.c; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawCoverCard(W, H){
  if(!coverImage || !coverImage.width) return;
  const cw=Math.min(200, W*0.40), ch=cw;
  const cx=W/2-cw/2, cy=Math.max(70, H*0.10);
  ctx.save();
  ctx.globalAlpha=0.55;
  ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=28;
  ctx.fillStyle='#0c1020';
  roundRect(cx-7, cy-7, cw+14, ch+14, 18); ctx.fill();
  ctx.shadowBlur=0;
  ctx.save();
  roundRect(cx, cy, cw, ch, 14); ctx.clip();
  ctx.drawImage(coverImage, cx, cy, cw, ch);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.5;
  roundRect(cx, cy, cw, ch, 14); ctx.stroke();
  const lg=ctx.createLinearGradient(cx, cy, cx, cy+ch);
  lg.addColorStop(0,'rgba(255,255,255,.28)'); lg.addColorStop(0.35,'rgba(255,255,255,0)');
  ctx.fillStyle=lg; roundRect(cx, cy, cw, ch, 14); ctx.fill();
  ctx.restore();
}

/* ---------- 主循环 ---------- */
function loop(){
  if(started && !ended && !paused){
    songTime = audioCtx.currentTime - startCtxTime;
  }
  if(started && !ended){
    updateMisses();
    // 更新 hold 进度
    for(let l=0;l<4;l++){
      const h = activeHold[l];
      if(h && h.duration>0) holdFill[l] = Math.min(1, Math.max(0,(songTime-h.time)/h.duration));
    }
    if(mode === 'tutorial'){
      scheduleTutorialClicks();
      updateTutorialBanner();
      if(songTime > tutorialDuration){ ended = true; }
    } else {
      updateLyrics(songTime);
    }
  }
  draw();
  updateHUD();
  if(started){
    const total = mode === 'tutorial' ? tutorialDuration : (audioBuffer ? audioBuffer.duration : 1);
    $('song-progress').firstElementChild.style.width = Math.min(100, songTime/total*100) + '%';
  }
  if(ended){
    // 结束未完成的 Hold / Flick 与剩余音符
    for(let l=0;l<4;l++){ if(activeHold[l]){ releaseLane(l); } if(activeFlick[l]){ finalizeFlick(l, activeFlick[l], true); } }
    for(let i=0;i<notes.length;i++) if(notes[i].state==='pending') finalizeNote(notes[i], 'miss');
    showResult();
    gameRaf = null;
    return;
  }
  gameRaf = requestAnimationFrame(loop);
}

function updateHUD(){
  $('hud-score').innerHTML = score + '<small>SCORE</small>';
  $('comboNum').textContent = combo;
  const total = counts.perfect + counts.good + counts.miss;
  const acc = total ? (counts.perfect + counts.good*0.6) / total * 100 : 100;
  $('hud-acc').textContent = 'ACC ' + acc.toFixed(1) + '%';
  $('comboNum').style.color = combo >= 30 ? '#ffd166' : '#5de0ff';
}

/* ---------- 歌词（LRC） ---------- */
function parseLRC(text){
  let offsetMs = 0;
  const om = text.match(/\[offset:\s*(-?\d+)\s*\]/i);
  if(om) offsetMs = parseInt(om[1],10);
  const out = [];
  const re = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  for(const raw of text.split(/\r?\n/)){
    const s = raw.trim();
    if(!s) continue;
    re.lastIndex = 0;
    const times = [];
    let m;
    while((m = re.exec(s)) !== null){
      const min = parseInt(m[1],10), sec = parseInt(m[2],10);
      let frac = 0;
      if(m[3]) frac = parseInt(m[3].padEnd(3,'0').slice(0,3),10)/1000;
      times.push(min*60 + sec + frac + offsetMs/1000);
    }
    if(times.length === 0) continue;
    const txt = s.replace(/\[[^\]]*\]/g, '').trim();
    if(!txt) continue;
    for(const t of times) out.push({time:t, text:txt});
  }
  out.sort((a,b)=>a.time-b.time);
  return out;
}
function decodeTextBuffer(buf){
  const u8 = new Uint8Array(buf);
  // BOM 检测
  if(u8.length >= 3 && u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
  if(u8.length >= 2 && u8[0]===0xFF && u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if(u8.length >= 2 && u8[0]===0xFE && u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  // 严格 UTF-8 解码；失败则按 GB18030（GBK/GB2312 超集）解码
  try{
    return new TextDecoder('utf-8', {fatal:true}).decode(u8);
  }catch(e){
    try{ return new TextDecoder('gb18030').decode(u8); }
    catch(e2){ return new TextDecoder('utf-8').decode(u8); }
  }
}
function handleLrcFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const text = decodeTextBuffer(reader.result);
      const parsed = parseLRC(text);
      if(parsed.length === 0){
        toast('未能从该文件解析出歌词（请确认是标准 .lrc 格式）', true);
        return;
      }
      lyrics = parsed; lyricIndex = -1; lastCurText = '';
      $('lrcStatus').textContent = '歌词已加载：'+parsed.length+' 行';
      toast('歌词加载成功：'+parsed.length+' 行');
    }catch(e){
      toast('歌词解析失败：'+e.message, true);
    }
  };
  reader.onerror = ()=>{ toast('读取歌词文件失败', true); };
  reader.readAsArrayBuffer(file);
}
function updateLyrics(t){
  if(!lyrics.length || mode !== 'song') return;
  while(lyricIndex + 1 < lyrics.length && lyrics[lyricIndex+1].time <= t) lyricIndex++;
  const prev = lyricIndex > 0 ? lyrics[lyricIndex-1].text : '';
  const cur  = lyricIndex >= 0 ? lyrics[lyricIndex].text : '';
  const next = lyricIndex + 1 < lyrics.length ? lyrics[lyricIndex+1].text : '';
  if(cur !== lastCurText){
    lastCurText = cur;
    $('lyric-prev').textContent = prev;
    $('lyric-cur').textContent = cur;
    $('lyric-next').textContent = next;
    if(cur) $('lyric-cur').animate([{opacity:.15, transform:'translateY(8px)'},{opacity:1, transform:'translateY(0)'}], {duration:340, easing:'ease-out'});
  }
}

/* ---------- 结算 ---------- */
function showResult(){
  if(source){ try{ source.stop(); }catch(e){} }
  started = false;
  const isTutorial = mode === 'tutorial';
  const total = counts.perfect + counts.good + counts.miss;
  const acc = total ? (counts.perfect + counts.good*0.6) / total * 100 : 100;
  $('resultScore').innerHTML = score + '<small> pts</small>';
  $('rPerfect').textContent = counts.perfect;
  $('rGood').textContent = counts.good;
  $('rMiss').textContent = counts.miss;
  $('rCombo').textContent = maxCombo;
  $('rAcc').textContent = acc.toFixed(1) + '%';
  let rank = 'C';
  if(acc >= 97 && counts.miss===0) rank = 'SS';
  else if(acc >= 95) rank = 'S';
  else if(acc >= 90) rank = 'A';
  else if(acc >= 80) rank = 'B';
  else if(acc >= 65) rank = 'C';
  $('resultRankBg').textContent = rank;
  if(isTutorial){
    $('resultTitle').textContent = '教程完成';
    $('resultRank').innerHTML = '准确率 <b>'+acc.toFixed(1)+'%</b> · Perfect '+counts.perfect+' / Good '+counts.good+' / Miss '+counts.miss;
    $('resultHigh').textContent = '';
    $('btnChangeDiff').style.display = 'none';
    $('btnShare').style.display = 'none';
    $('btnRetry').textContent = '↻ 再来一次教程';
    $('btnNewSong').textContent = '返回主菜单';
  } else {
    $('resultTitle').textContent = '结算';
    $('resultRank').innerHTML = '评级 <b>'+rank+'</b> · '+selectedDiff.toUpperCase();
    $('btnChangeDiff').style.display = '';
    $('btnShare').style.display = '';
    $('btnRetry').textContent = '↻ 重新游玩';
    $('btnNewSong').textContent = '导入新曲目';
    // 最高分
    let high = 0;
    try{
      const raw = localStorage.getItem('rhythmforge_hs_'+fileKey);
      const prev = raw ? JSON.parse(raw) : null;
      if(prev) high = prev.score||0;
      if(score > high){
        high = score;
        localStorage.setItem('rhythmforge_hs_'+fileKey, JSON.stringify({score, acc, combo:maxCombo, date:Date.now()}));
      }
    }catch(e){ /* 隐私模式等场景忽略 */ }
    $('resultHigh').textContent = '本曲最高分：' + (high>0? high : '—') + (score>=high && score>0 ? '（新纪录！）' : '');
  }
  show('result');
}

/* ---------- 分享战绩卡片 ---------- */
function computeRank(acc){
  if(acc >= 97 && counts.miss===0) return 'SS';
  if(acc >= 95) return 'S';
  if(acc >= 90) return 'A';
  if(acc >= 80) return 'B';
  if(acc >= 65) return 'C';
  return 'D';
}

/* ============================== 输入 ============================== */
document.addEventListener('keydown', e=>{
  if(paused || screenActive()==='game'){ 
    if(e.key==='Escape'){ togglePause(); return; }
  }
  if(screenActive()!=='game' || paused) return;
  const k = e.key.toLowerCase();
  if(k in LANE_KEYS && !e.repeat) pressLane(LANE_KEYS[k], 'key');
});
document.addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k in LANE_KEYS) releaseLane(LANE_KEYS[k]);
});

const pointers = new Map(); // pointerId -> {lane, sx, sy}
canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  if(!started || paused){ return; }
  const lane = laneFromX(e.clientX);
  pointers.set(e.pointerId, {lane, sx: e.clientX, sy: e.clientY});
  pressLane(lane, 'touch');
});
canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  const d = Math.hypot(e.clientX - p.sx, e.clientY - p.sy);
  if(d > flickSwipe[p.lane]) flickSwipe[p.lane] = d;
});
canvas.addEventListener('pointerup', e=>{
  e.preventDefault();
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  const p = pointers.get(e.pointerId);
  if(p){ releaseLane(p.lane); pointers.delete(e.pointerId); }
});
canvas.addEventListener('pointercancel', e=>{
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  const p = pointers.get(e.pointerId);
  if(p){ releaseLane(p.lane); pointers.delete(e.pointerId); }
});
function laneFromX(clientX){
  const r = canvas.getBoundingClientRect();
  const x = clientX - r.left;
  return Math.min(3, Math.max(0, Math.floor(x/(r.width/4))));
}

function screenActive(){
  for(const s of screens){ if($('screen-'+s).classList.contains('active')) return s; }
  return 'import';
}

/* ---------- 暂停 ---------- */
function togglePause(){
  if(screenActive()!=='game') return;
  if(paused){
    audioCtx.resume();
    paused = false;
    $('pauseOverlay').classList.remove('show');
  } else {
    audioCtx.suspend();
    paused = true;
    $('pauseOverlay').classList.add('show');
  }
}

/* ============================== 新手教程 ============================== */
function buildTutorialChart(){
  const N = [];
  const tap   = (t,l)   => N.push({time:t, lane:l, type:'tap',   duration:0, end:t});
  const hold  = (t,l,d) => N.push({time:t, lane:l, type:'hold',  duration:d, end:t+d});
  const flick = (t,l)   => N.push({time:t, lane:l, type:'flick', duration:0, end:t});
  // ① TAP：阶梯式下落
  [0,1,2,3,2,1,0,1].forEach((l,i)=> tap(2.5 + i*0.5, l));
  // ② HOLD：左右手交替长按
  hold(8.0, 0, 0.9); hold(9.2, 2, 0.9); hold(10.4, 1, 0.9); hold(11.6, 3, 0.9);
  // ③ FLICK：快速点按/滑动
  [0,1,2,3,0,1,2,3].forEach((l,i)=> flick(14.0 + i*0.5, l));
  // ④ 综合练习
  tap(19.0,0); hold(19.5,2,0.9); tap(20.0,1); tap(20.5,3);
  hold(21.0,0,0.9); tap(21.5,2); flick(22.0,1); flick(22.5,3);
  tap(23.0,0); tap(23.5,2); flick(24.0,1); hold(24.5,3,1.0);
  return N;
}
const TUTORIAL_SECTIONS = [
  {t:0,  text:'🎵 新手教程 — 跟随节拍点击'},
  {t:2,  text:'① TAP：音符到达判定线时「按下 / 点击」'},
  {t:7,  text:'② HOLD：长条到达后「按住不放」直到结束'},
  {t:13, text:'③ FLICK：橙色音符「快速点按」或「滑动」'},
  {t:18, text:'综合练习！'}
];
function startTutorial(){
  ensureAudioCtx();
  mode = 'tutorial';
  notes = buildTutorialChart().map(n => ({time:n.time, lane:n.lane, type:n.type, duration:n.duration||0,
    end:n.end||n.time, state:'pending', judged:false, grade:null, headGrade:null, flickSource:'key'}));
  notes.sort((a,b)=>a.time-b.time);
  tutorialDuration = 26.5;
  tutorialBeats = []; for(let t=0.5; t<tutorialDuration; t+=0.5) tutorialBeats.push(t);
  tutBeatIdx = 0;
  score = 0; combo = 0; maxCombo = 0;
  counts = {perfect:0, good:0, miss:0};
  activeHold = [null,null,null,null]; holdFill = [0,0,0,0];
  activeFlick = [null,null,null,null]; flickPressMs = [0,0,0,0]; flickSwipe = [0,0,0,0];
  particles = [];
  started = false; ended = false; paused = false;
  show('game'); resizeCanvas(); updateHUD();
  $('pauseOverlay').classList.remove('show');
  $('btnPause').style.display = 'block';
  mood = 'calm'; ambient = []; coverImage = null;
  lyricIndex = -1; lastCurText = '';
  $('lyrics').style.display = 'none';
  $('tutorial-banner').textContent = TUTORIAL_SECTIONS[0].text;
  flashJudge('READY', '#5de0ff', 900);
  setTimeout(()=>{ flashJudge('GO', '#5dff9b', 500); }, 700);
  if(audioCtx.state === 'suspended') audioCtx.resume();
  startCtxTime = audioCtx.currentTime;
  started = true;
  if(!gameRaf) gameRaf = requestAnimationFrame(loop);
}
function scheduleClick(when, freq){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.25, when + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
  o.connect(g); g.connect(sfxGain);
  o.start(when); o.stop(when + 0.07);
}
function scheduleTutorialClicks(){
  const lookahead = 0.18;
  while(tutBeatIdx < tutorialBeats.length && tutorialBeats[tutBeatIdx] <= songTime + lookahead){
    const bt = tutorialBeats[tutBeatIdx];
    scheduleClick(startCtxTime + bt, tutBeatIdx % 2 === 0 ? 880 : 660);
    tutBeatIdx++;
  }
}
function updateTutorialBanner(){
  let txt = TUTORIAL_SECTIONS[0].text;
  for(const s of TUTORIAL_SECTIONS){ if(songTime >= s.t) txt = s.text; else break; }
  const el = $('tutorial-banner');
  if(el.textContent !== txt) el.textContent = txt;
}

/* ============================== 事件绑定 ============================== */
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.className = ''; }, 4000);
}
